define host {
    use                     linux-server
    host_name               app01
    alias                   App Server 1
    address                 192.168.56.22
}

define service {
    use                     local-service
    host_name               app01
    service_description     PING
    check_command           check_ping!100.0,20%!500.0,60%
}

define command {
    command_name    check_app_health
    command_line    $USER1$/check_app_health.sh
}

define service {
    use                     local-service
    host_name               app01
    service_description     Task Manager API Health
    check_command           check_app_health
}

define command {
    command_name    check_app_tasks
    command_line    $USER1$/check_app_tasks.py
}

define service {
    use                     local-service
    host_name               app01
    service_description     Task Manager Pending Tasks
    check_command           check_app_tasks
}

define command {
    command_name    check_nrpe_cmd
    command_line    /usr/lib/nagios/plugins/check_nrpe -H $HOSTADDRESS$ -c $ARG1$
}

define service {
    use                     local-service
    host_name               app01
    service_description     Load NRPE
    check_command           check_nrpe_cmd!lab_load
}

define service {
    use                     local-service
    host_name               app01
    service_description     Disk / NRPE
    check_command           check_nrpe_cmd!lab_disk_root
}

define service {
    use                     local-service
    host_name               app01
    service_description     Gunicorn Process NRPE
    check_command           check_nrpe_cmd!lab_gunicorn
}
