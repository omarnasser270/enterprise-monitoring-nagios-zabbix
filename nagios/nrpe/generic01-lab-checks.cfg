command[lab_load]=/usr/lib/nagios/plugins/check_load -w 1.5,1.2,1.0 -c 3.0,2.5,2.0
command[lab_disk_root]=/usr/lib/nagios/plugins/check_disk -w 20% -c 10% -p /
command[lab_apache]=/usr/lib/nagios/plugins/check_procs -c 1: -C apache2
command[lab_heartbeat]=/usr/lib/nagios/plugins/check_file_age -w 120 -c 180 -f /var/lib/heartbeat
