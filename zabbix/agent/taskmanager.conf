# Installed on app01 as /etc/zabbix/zabbix_agent2.d/taskmanager.conf
# Exposes the Flask API /metrics-custom values as Zabbix items:
#   taskmanager.metric[tasks_pending]
#   taskmanager.metric[tasks_total]
#   taskmanager.metric[requests_total]
#   taskmanager.metric[uptime_seconds]
UserParameter=taskmanager.metric[*],curl -s http://127.0.0.1:5000/metrics-custom | python3 -c "import sys,json; print(json.load(sys.stdin)['$1'])"
